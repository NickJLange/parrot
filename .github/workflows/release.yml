name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build arm64 macOS binary
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: swift version
        run: swift --version

      - name: cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: build
        run: swift build -c release --arch arm64

      - name: stage
        run: |
          BIN=.build/arm64-apple-macosx/release/parrot
          file "$BIN"
          mkdir -p dist
          cp "$BIN" dist/parrot

      - name: strip
        run: strip -x dist/parrot

      - name: smoke test
        run: |
          BIN=dist/parrot
          "$BIN" --help
          "$BIN" run --help
          "$BIN" models list

          # GitHub-hosted runners have no Accessibility/Microphone grants
          # (no TCC UI to click through), so doctor and run are expected to
          # report/fail on permissions here -- this checks the binary
          # behaves correctly under that constraint, not that a live
          # dictation session works end to end (that needs a real machine
          # with permissions already granted).
          "$BIN" doctor || true

          timeout 300 "$BIN" run --skip-doctor --hotkey right-option > run.log 2>&1
          status=$?
          cat run.log

          if ! grep -q "loading whisper-base.en" run.log; then
            echo "::error::model warmup never started -- WhisperKit load likely broken"
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error::expected exit 1 (no Accessibility in CI), got $status"
            exit 1
          fi
          if ! grep -q "failed to register hotkey tap" run.log; then
            echo "::error::did not fail at the expected step (hotkey tap registration)"
            exit 1
          fi

      - name: package
        run: |
          cd dist
          tar -czf parrot-macos-arm64.tar.gz parrot
          shasum -a 256 parrot-macos-arm64.tar.gz > parrot-macos-arm64.tar.gz.sha256
          ls -lh

      - name: release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/parrot-macos-arm64.tar.gz
            dist/parrot-macos-arm64.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
