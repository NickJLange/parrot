name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build arm64 macOS binary
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: swift version
        run: swift --version

      - name: cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: build
        run: swift build -c release --arch arm64

      - name: stage
        run: |
          BIN=.build/arm64-apple-macosx/release/parrot
          file "$BIN"
          mkdir -p dist
          cp "$BIN" dist/parrot

      - name: strip
        run: strip -x dist/parrot

      - name: smoke test
        run: |
          BIN=dist/parrot
          "$BIN" --help
          "$BIN" run --help
          "$BIN" models list

          # Permission state varies by runner (some GitHub-hosted macOS
          # runners report Accessibility as already granted, others don't),
          # so this doesn't assume either outcome -- it just checks the
          # binary doesn't crash. Not a substitute for a live dictation
          # test on a machine with permissions actually granted.
          "$BIN" doctor || true

          # No `timeout` on macOS (BSD userland, not GNU coreutils) --
          # poll in the background instead, bounded to 90s either way.
          "$BIN" run --skip-doctor --hotkey right-option > run.log 2>&1 &
          PID=$!
          for _ in $(seq 1 90); do
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            if grep -qE "listening on|failed to register hotkey tap" run.log 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if kill -0 "$PID" 2>/dev/null; then
            # Still running: reached a steady state (hotkey tap registered,
            # sitting in its event loop) without crashing -- stop it.
            kill "$PID"
            wait "$PID" 2>/dev/null
            result="alive"
          else
            wait "$PID"
            status=$?
            result="exited:$status"
          fi

          cat run.log

          if ! grep -q "loading whisper-base.en" run.log; then
            echo "::error::model warmup never started -- WhisperKit load likely broken"
            exit 1
          fi

          case "$result" in
            alive)
              echo "reached steady state (hotkey tap active) without crashing"
              ;;
            exited:1)
              if ! grep -q "failed to register hotkey tap" run.log; then
                echo "::error::exited 1 but not at the expected step"
                exit 1
              fi
              echo "failed gracefully at hotkey-tap registration (no Accessibility grant)"
              ;;
            *)
              echo "::error::unexpected outcome: $result"
              exit 1
              ;;
          esac

      - name: package
        run: |
          cd dist
          tar -czf parrot-macos-arm64.tar.gz parrot
          shasum -a 256 parrot-macos-arm64.tar.gz > parrot-macos-arm64.tar.gz.sha256
          ls -lh

      - name: release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/parrot-macos-arm64.tar.gz
            dist/parrot-macos-arm64.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
